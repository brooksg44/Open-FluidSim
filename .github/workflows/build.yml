name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      # cl-raylib pulls in cffi-libffi (raylib passes structs by value), whose
      # grovel step shells out to pkg-config and #includes <ffi.h>. Neither is
      # present on a stock runner, so supply a MinGW toolchain that has both.
      - name: Install MinGW toolchain with libffi
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-libffi

      - name: Put MinGW and the workspace on PATH
        shell: pwsh
        run: |
          # Prepended so grovel picks this gcc/pkg-config; the workspace entry
          # makes raylib.dll and libffi-8.dll loadable during the build.
          Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE"

      - name: Verify pkg-config finds libffi
        shell: pwsh
        run: |
          pkg-config --cflags libffi
          if ($LASTEXITCODE -ne 0) { throw "pkg-config cannot resolve libffi; cffi-libffi grovel would fail" }

      - name: Install SBCL
        run: choco install sbcl --no-progress -y

      - name: Install Quicklisp
        shell: pwsh
        run: |
          Invoke-WebRequest https://beta.quicklisp.org/quicklisp.lisp -OutFile quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp `
               --eval '(quicklisp-quickstart:install)'

      - name: Clone cl-raylib
        shell: pwsh
        run: |
          git clone https://github.com/longlene/cl-raylib "$env:USERPROFILE\quicklisp\local-projects\cl-raylib"

      - name: Fetch runtime DLLs
        shell: pwsh
        run: |
          $v = "5.5"
          Invoke-WebRequest "https://github.com/raysan5/raylib/releases/download/$v/raylib-$v`_win64_msvc16.zip" -OutFile raylib.zip
          Expand-Archive raylib.zip -DestinationPath raylib
          Copy-Item (Get-ChildItem -Recurse -Filter raylib.dll raylib).FullName .
          # cffi-libffi dlopens libffi-8.dll at startup, including from the
          # dumped image, so it has to ship next to the .exe.
          Copy-Item "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin\libffi-8.dll" .

      - name: Build
        run: sbcl --noinform --disable-debugger --non-interactive --load build.lisp

      - uses: actions/upload-artifact@v5
        with:
          name: open-fluidsim-windows
          path: |
            open-fluidsim.exe
            raylib.dll
            libffi-8.dll
            # The example circuits, which the exe looks for in a circuits/
            # directory beside itself. Keep the folder next to the .exe when
            # unzipping or the L prompt will offer nothing to load.
            circuits/

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      # raylib for the renderer; libffi and pkg-config for the same cffi-libffi
      # grovel step Windows needs. macOS ships a libffi but no headers outside
      # the SDK, and brew's is keg-only, hence PKG_CONFIG_PATH below.
      - name: Install SBCL and raylib
        run: brew install sbcl raylib pkg-config libffi

      - name: Install Quicklisp
        run: |
          curl -fsSL https://beta.quicklisp.org/quicklisp.lisp -o quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)'

      - name: Clone cl-raylib
        run: git clone https://github.com/longlene/cl-raylib ~/quicklisp/local-projects/cl-raylib

      - name: Build
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libffi)/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          pkg-config --cflags libffi
          sbcl --noinform --disable-debugger --non-interactive --load build.lisp
          file open-fluidsim

      - uses: actions/upload-artifact@v5
        with:
          name: open-fluidsim-macos
          path: |
            open-fluidsim
            circuits/

  release:
    # Tags only. Pushes to main still build, so a broken tree is caught before
    # anyone tags it, but they publish nothing.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist

      - name: Package
        run: |
          set -eux
          tag="${GITHUB_REF_NAME}"
          # Artifacts do not carry the executable bit, so the Unix binary
          # arrives unrunnable and has to be marked again before zipping.
          chmod +x dist/open-fluidsim-macos/open-fluidsim
          (cd dist/open-fluidsim-windows && zip -r "../open-fluidsim-${tag}-windows-x64.zip" .)
          (cd dist/open-fluidsim-macos   && zip -r "../open-fluidsim-${tag}-macos-arm64.zip" .)
          ls -l dist/*.zip

      - name: Release notes
        run: |
          cat > notes.md <<'EOF'
          ## Downloads

          | | |
          |---|---|
          | Windows (x86-64) | `open-fluidsim-VERSION-windows-x64.zip` |
          | macOS (Apple Silicon) | `open-fluidsim-VERSION-macos-arm64.zip` |

          **Unzip the whole folder and keep it together.** The program looks for
          `raylib.dll` / `libffi-8.dll` and the `circuits/` examples beside
          itself; lifting the executable out on its own loses all of them.

          ### Windows

          Run `open-fluidsim.exe`. It is unsigned, so SmartScreen will warn on
          first launch: *More info* → *Run anyway*.

          ### macOS

          Needs raylib installed, which the binary loads at startup:

          ```sh
          brew install raylib
          ```

          It is unsigned too, so the first launch needs right-click → *Open*, or
          `xattr -dr com.apple.quarantine open-fluidsim`.

          ### Where your circuits go

          `S` saves to `Documents\Open-FluidSim` on Windows and
          `~/Documents/Open-FluidSim` on macOS; `L` searches there first and the
          bundled `circuits/` after, so the examples load by name and your edits
          never overwrite them. Set `OPEN_FLUIDSIM_CIRCUITS` to put them
          somewhere else.
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME}/g" notes.md
          cat notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Open FluidSim ${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*.zip
